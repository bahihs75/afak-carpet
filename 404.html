<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — الصفحة غير موجودة | AFAK CARPET</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root{
      --afak-ink:#14171f;
      --afak-navy:#27325f;
      --afak-bordeaux:#8f2d3d;
      --afak-muted:#6d727d;
      --afak-line:#d9dce2;
      --afak-canvas:#f7f7f5;
      --afak-white:#fff;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      background:var(--afak-canvas);
      color:var(--afak-ink);
      font-family:Tajawal,Arial,sans-serif;
    }
    .error-page{
      min-height:100vh;
      display:grid;
      grid-template-rows:auto 1fr auto;
    }
    .error-header{
      border-bottom:1px solid var(--afak-line);
      background:rgba(255,255,255,.88);
    }
    .error-header-inner,.error-footer-inner{
      width:min(1180px,calc(100% - 40px));
      margin:0 auto;
    }
    .error-header-inner{
      min-height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }
    .brand{
      color:var(--afak-ink);
      text-decoration:none;
      font-weight:800;
      letter-spacing:.07em;
      font-size:17px;
    }
    .language-button{
      border:1px solid var(--afak-line);
      background:var(--afak-white);
      color:var(--afak-navy);
      min-height:38px;
      min-width:70px;
      padding:0 14px;
      font:600 12px/1 Tajawal,Arial,sans-serif;
      cursor:pointer;
      transition:background 180ms ease,color 180ms ease,transform 120ms ease;
    }
    .language-button:hover{background:var(--afak-navy);color:#fff}
    .language-button:active{transform:scale(.97)}
    .error-main{
      width:min(1180px,calc(100% - 40px));
      margin:0 auto;
      display:grid;
      grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);
      align-items:center;
      gap:clamp(40px,8vw,120px);
      padding:clamp(72px,12vh,150px) 0;
    }
    .error-code{
      margin:0;
      color:var(--afak-bordeaux);
      font:500 clamp(96px,19vw,250px)/.82 "IBM Plex Mono",ui-monospace,monospace;
      letter-spacing:-.09em;
    }
    .error-copy{max-width:540px}
    .eyebrow{
      margin:0 0 16px;
      color:var(--afak-muted);
      font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    h1{
      margin:0;
      color:var(--afak-ink);
      font-size:clamp(30px,4vw,54px);
      line-height:1.15;
      font-weight:700;
    }
    .error-description{
      margin:20px 0 28px;
      color:var(--afak-muted);
      font-size:17px;
      line-height:1.9;
    }
    .error-actions{display:flex;flex-wrap:wrap;gap:12px}
    .error-button{
      min-height:50px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 26px;
      border:1px solid var(--afak-navy);
      background:var(--afak-navy);
      color:#fff;
      text-decoration:none;
      font-weight:700;
      transition:background 180ms ease,color 180ms ease,transform 120ms ease;
    }
    .error-button:hover{background:var(--afak-ink);border-color:var(--afak-ink)}
    .error-button:active{transform:scale(.98)}
    .error-button.secondary{background:transparent;color:var(--afak-navy)}
    .error-button.secondary:hover{background:var(--afak-navy);color:#fff}
    .error-mark{
      min-height:300px;
      border:2px solid var(--afak-bordeaux);
      display:grid;
      place-items:center;
      position:relative;
      background:var(--afak-white);
    }
    .error-mark::before,.error-mark::after{
      content:"";
      position:absolute;
      background:var(--afak-bordeaux);
      opacity:.22;
    }
    .error-mark::before{width:1px;height:72%;top:14%;left:50%}
    .error-mark::after{height:1px;width:72%;left:14%;top:50%}
    .error-mark-inner{
      position:relative;
      z-index:1;
      width:112px;
      height:112px;
      display:grid;
      place-items:center;
      border:1px solid var(--afak-navy);
      background:var(--afak-white);
      color:var(--afak-navy);
      font:500 15px/1 "IBM Plex Mono",ui-monospace,monospace;
      letter-spacing:.05em;
    }
    .error-footer{border-top:1px solid var(--afak-line);background:var(--afak-white)}
    .error-footer-inner{
      min-height:64px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      color:var(--afak-muted);
      font-size:12px;
    }
    .error-footer-inner span:last-child{font-family:"IBM Plex Mono",ui-monospace,monospace}
    :focus-visible{outline:3px solid rgba(143,45,61,.35);outline-offset:3px}
    @media (max-width:760px){
      .error-main{grid-template-columns:1fr;gap:42px;padding:64px 0 78px}
      .error-code{font-size:clamp(100px,30vw,180px)}
      .error-mark{min-height:220px;order:-1}
      .error-copy{max-width:none}
    }
    @media (max-width:480px){
      .error-header-inner,.error-footer-inner,.error-main{width:min(100% - 28px,1180px)}
      .error-header-inner{min-height:64px}
      .error-footer-inner{align-items:flex-start;flex-direction:column;justify-content:center;padding:16px 0;gap:6px}
      .error-actions{flex-direction:column}
      .error-button{width:100%}
    }
    @media (prefers-reduced-motion:reduce){
      .language-button,.error-button{transition:none}
    }
  </style>
</head>
<body>
  <div class="error-page">
    <header class="error-header">
      <div class="error-header-inner">
        <a class="brand" href="/" aria-label="AFAK CARPET — الصفحة الرئيسية">AFAK CARPET</a>
        <button class="language-button" id="languageButton" type="button" aria-label="Switch language">EN</button>
      </div>
    </header>

    <main class="error-main" id="errorMain">
      <div class="error-copy" aria-live="polite">
        <p class="eyebrow" id="errorEyebrow">AFAK CARPET / 404</p>
        <h1 id="errorTitle">الصفحة غير موجودة</h1>
        <p class="error-description" id="errorDescription">يبدو أن الرابط الذي فتحته غير متاح أو لم يعد موجودًا. يمكنك العودة إلى الصفحة الرئيسية ومتابعة استكشاف مجموعتنا.</p>
        <div class="error-actions">
          <a class="error-button" id="homeButton" href="/">العودة إلى الصفحة الرئيسية</a>
          <a class="error-button secondary" id="backButton" href="javascript:history.back()">الصفحة السابقة</a>
        </div>
      </div>
      <div class="error-mark" aria-hidden="true">
        <div class="error-mark-inner">404</div>
      </div>
    </main>

    <footer class="error-footer">
      <div class="error-footer-inner">
        <span id="footerText">سجاد يُصنع ليُصلَّى عليه ويدوم.</span>
        <span>AFAK CARPET</span>
      </div>
    </footer>
  </div>

  <script>
    (() => {
      const button = document.getElementById("languageButton");
      const title = document.getElementById("errorTitle");
      const description = document.getElementById("errorDescription");
      const home = document.getElementById("homeButton");
      const back = document.getElementById("backButton");
      const footer = document.getElementById("footerText");
      let lang = "ar";
      const copy = {
        ar: {
          pageTitle: "404 — الصفحة غير موجودة | AFAK CARPET",
          title: "الصفحة غير موجودة",
          description: "يبدو أن الرابط الذي فتحته غير متاح أو لم يعد موجودًا. يمكنك العودة إلى الصفحة الرئيسية ومتابعة استكشاف مجموعتنا.",
          home: "العودة إلى الصفحة الرئيسية",
          back: "الصفحة السابقة",
          footer: "سجاد يُصنع ليُصلَّى عليه ويدوم.",
          button: "EN"
        },
        en: {
          pageTitle: "404 — Page not found | AFAK CARPET",
          title: "Page not found",
          description: "The link you opened may be unavailable or no longer exists. Return home and continue exploring our collection.",
          home: "Back to homepage",
          back: "Previous page",
          footer: "Carpets made to be prayed on, and to last.",
          button: "AR"
        }
      };
      function render(){
        const text = copy[lang];
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document.title = text.pageTitle;
        title.textContent = text.title;
        description.textContent = text.description;
        home.textContent = text.home;
        back.textContent = text.back;
        footer.textContent = text.footer;
        button.textContent = text.button;
        button.setAttribute("aria-label", lang === "ar" ? "Switch language" : "تغيير اللغة");
      }
      button.addEventListener("click", () => { lang = lang === "ar" ? "en" : "ar"; render(); });
    })();
  </script>
</body>
</html>
